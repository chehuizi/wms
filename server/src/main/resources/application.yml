server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: wms-server

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/wms
    username: chehuizi
    password:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: wms-hikari
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.wms.entity,com.wms.vo
  configuration:
    map-underscore-to-camel-case: true
    # 开发环境打印 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.wms: DEBUG
    com.wms.mapper: DEBUG
    org.flywaydb: INFO
